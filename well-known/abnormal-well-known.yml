source: live probes of every Abnormal AI host, 2026-08-02
summary: >-
  Abnormal AI publishes almost no /.well-known/ discovery surface. The API hosts
  (api.abnormalplatform.com, eu.rest.abnormalsecurity.com) answer 401 to every path including
  /.well-known/*, because the whole origin is bearer-token gated. The marketing site
  (abnormal.ai) and the portal return 404/403. The single 200 is on the trust-center host
  security.abnormal.ai, and that document belongs to SafeBase — the trust-center SaaS vendor
  Abnormal runs there — not to the Abnormal Security Client API. No security.txt (RFC 9116),
  no api-catalog (RFC 9727), no ai-plugin.json, and no A2A agent card was found on any host.
