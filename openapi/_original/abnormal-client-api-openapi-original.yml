    ThreatLinks:
      type: object
      properties:
        abxMessageId:
          type: integer
          description: An integer representing a unique identifier for an individual
            message within a threat (i.e email campaign). This is deprecated, use
            abxMessageIdStr instead.
          deprecated: true
          example: 4551618356913732000
        abxMessageIdStr:
          type: string
          description: A string representing a unique identifier for an individual
            message within a threat (i.e email campaign).
          example: 4551618356913732000
        domainLink:
          type: string
          description: The domain name of the link
          example: lamronba.com
        linkType:
          type: string
          description: The type of link in the email
          example: html href
        source:
          type: string
          description: The location in the email where the link may be found
          example: body
        displayText:
          type: string
          description: The link's display text
          example: This is not a spoof!
        linkUrl:
          type: string
          description: The URL of the link
          example: http://spoof.lamronba.com
      required:
      - abxMessageId
      - abxMessageIdStr
      - displayText
      - domainLink
      - linkType
      - linkUrl
      - source
    ThreatLinksResponse:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/ThreatLinks'
          description: List of links in the email messages of a threat
        tenantId:
          type: integer
          nullable: true
          description: The tenant ID associated with the threat
          example: 1234
        tenantName:
          type: string
          nullable: true
          description: The short name of the tenant associated with the threat
          example: example-tenant
      required:
      - links
      - tenantId
      - tenantName
    ThreatMessage:
      type: object
      properties:
        threatId:
          type: string
          description: An id which maps to a threat campaign. A threat campaign might
            be received by multiple users.
          example: 184712ab-6d8b-47b3-89d3-a314efef79e2
        abxMessageId:
          type: integer
          description: An integer representing a unique identifier for an individual
            message within a threat (i.e email campaign). This is deprecated, use
            abxMessageIdStr instead.
          deprecated: true
          example: 4551618356913732000
        abxMessageIdStr:
          type: string
          description: A string representing a unique identifier for an individual
            message within a threat (i.e email campaign).
          example: 4551618356913732000
        abxPortalUrl:
          type: string
          description: The URL at which the specific message details are viewable
            in Abnormal Security's Portal web interface.
          example: https://portal.abnormalsecurity.com/home/threat-center/remediation-history/4551618356913732076
        subject:
          type: string
          description: The email subject.
          example: Phishing Email
        fromAddress:
          type: string
          description: The email address of the sender.
          example: support@secure-reply.org
        fromName:
          type: string
          description: The display name of the sender.
          example: Support
        senderDomain:
          type: string
          description: Email domain of sender (only available for IESS customers)
          example: secure-reply.org
        toAddresses:
          type: string
          description: All the email addresses to which the message was sent, comma-separated
            & truncated at 255 chars.
          example: example@example.com, another@example.com
        recipientAddress:
          type: string
          description: The email address of the user who actually received the message.
          example: example@example.com
        receivedTime:
          type: string
          format: date-time
          description: The timestamp at which this message arrived.
          example: '2020-06-09T17:42:59Z'
        sentTime:
          type: string
          format: date-time
          description: The timestamp at which this message was sent.
          example: '2020-06-09T17:42:59Z'
        internetMessageId:
          type: string
          description: The internet message ID, per RFC 822
          example: <5edfca1c.1c69fb81.4b055.8fd5@mx.google.com>
        remediationStatus:
          type: string
          description: The remediation status of the email threat.
          example: Auto Remediated
        attackType:
          type: string
          description: The type of threat the message represents.
          example: Extortion
        attackStrategy:
          type: string
          description: The strategy of threat the message represents.
          example: Name Impersonation
        returnPath:
          type: string
          description: The path where this message was sent.
          example: support@secure-reply.org
        replyToEmails:
          type: array
          items:
            type: string
          description: The 'reply-to' list of emails.
          example:
          - reply-to@example.com
        ccEmails:
          type: array
          items:
            type: string
          description: List of email addresses CC'ed.
          example:
          - cc@example.com
        senderIpAddress:
          type: string
          description: IP address of sender.
          example: 100.101.102.103
        impersonatedParty:
          type: string
          description: Impersonated party, if any.
          example: None / Others
        attackVector:
          type: string
          description: The attack medium.
          example: Text
        attachmentNames:
          type: array
          items:
            type: string
          description: List of attachment names, if any.
          example:
          - attachment.pdf
        attachmentCount:
          type: integer
          description: Number of attachments in email (only available for IESS customers)
        urls:
          type: array
          items:
            type: string
          description: URLs present in the email body, if any.
          example:
          - https://www.google.com/
        urlCount:
          type: integer
          description: Number of urls in email (only available for IESS customers)
        summaryInsights:
          type: array
          items:
            type: string
          description: A summary of insights into this attack.
          example:
          - Bitcoin Topics
          - Personal Information Theft
          - Unusual Sender
        remediationTimestamp:
          type: string
          format: date-time
          description: The timestamp at which this message was remediated, or empty
            if it has not been remediated.
          example: '2020-06-09T17:42:59Z'
        isRead:
          type: boolean
          description: Whether an email has been read
          example: 'true'
        attackedParty:
          type: string
          description: The party that was targeted by an attack.
          example: VIP
        autoRemediated:
          type: boolean
          description: Indicates whether Abnormal has automatically detected and remediated
            the message from the user's Inbox. Note``:`` Abnormal has retained this
            field and the postRemediated field to support prior integrations, but
            in newly created integrations, you should capture this information from
            the remediationStatus field.
          example: 'True'
        postRemediated:
          type: boolean
          description: Indicates whether Abnormal remediated the campaign at a later
            time, after landing in the user's Inbox. Note``:`` Abnormal has retained
            this field and the autoRemediated field to support prior integrations,
            but in newly created integrations, you should capture this information
            from the remediationStatus field.
          example: 'False'
        source:
          type: string
          nullable: true
          description: A string representing the judgement of the message.
          example: Attack
        tenantId:
          type: integer
          nullable: true
          description: The tenant ID associated with this message.
          example: 1000
        tenantName:
          type: string
          nullable: true
          description: The tenant name associated with this message.
          example: acme-corp
        customerOverride:
          allOf:
          - $ref: '#/components/schemas/CustomerOverride'
          nullable: true
      required:
      - abxMessageId
      - abxMessageIdStr
      - abxPortalUrl
      - attachmentCount
      - attachmentNames
      - attackStrategy
      - attackType
      - attackVector
      - attackedParty
      - autoRemediated
      - ccEmails
      - fromAddress
      - fromName
      - impersonatedParty
      - internetMessageId
      - isRead
      - postRemediated
      - receivedTime
      - recipientAddress
      - remediationStatus
      - remediationTimestamp
      - replyToEmails
      - returnPath
      - senderDomain
      - senderIpAddress
      - sentTime
      - subject
      - summaryInsights
      - threatId
      - toAddresses
      - urlCount
      - urls
    TimelineEntry:
