                $ref: '#/components/schemas/ThreatAttachmentsResponse'
          description: Details of the attachments in a threat campaign. This API can
            be used to obtain the details of the links that are embedded in the email
            messages of a threat.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
