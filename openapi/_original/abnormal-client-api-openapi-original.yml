  /threats_export/csv:
    get:
      operationId: v1_threats_export_csv_retrieve
      summary: Download data from Threat Log in .csv format
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - csv
          - json
      - in: query
        name: filter
        schema:
          type: string
        description: Max time range is 14 days. If only one of the gte or lte filters
          are specified, the time range defaults to 1 day within the specified filter.
          If neither of the gte or lte filters are specified, the time range defaults
          to the previous date to the current date.
        style: spaceDelimited
        examples:
          ReceivedTime:
            value: receivedTime gte 2023-01-01T01:01:01Z lte 2023-01-14T01:01:01Z
            summary: receivedTime
      - in: header
        name: mock-data
        schema:
          type: string
          default: 'False'
          enum:
          - 'False'
          - 'True'
        description: Returns test data if set to `True`
      - in: query
        name: source
        schema:
          type: string
          default: all
          enum:
          - all
          - attacks
          - borderline
          - spam
        description: Filters threats based on the source of detection. 'all' returns
          threats from all sources, 'spam' returns only spam threats, 'attacks' returns
          only attack threats, and 'borderline' returns only borderline threats.
      - in: header
        name: Accept
        schema:
          type: string
          enum:
          - application/json
          - text/csv
          default: application/json
        description: Controls the response format. Use 'text/csv' to receive data
          in CSV format, or 'application/json' for JSON format (default).
      tags:
      - Threats
      responses:
        '200':
          content:
            text/csv:
              schema:
                type: string
                example: "Date,From Display Name,From Email,Subject,Recipient Email,Job\
                  \ Title of Sender,Job Title of Recipient,Abnormals best guess of\
                  \ attack type,Abnormals best guess of attack strategy,Abnormals\
                  \ best guess of impersonated entity,Abnormals best guess of attack\
                  \ vector,Remediation Status,Remediation Time,Judgement,Abnormal\
                  \ Message ID,Threat ID,Tenant ID,Tenant Name\r\n2020-06-09T17:42:59Z,,support@secure-reply.org,Phishing\
                  \ Email,example@example.com,,,Extortion,Name Impersonation,None\
                  \ / Others,Text,Auto-Remediated,2020-06-09T18:00:00Z,Malicious,4551618356913732000,42,acme-corp"
          description: 'A csv list of all messages in the Threat Log. Headers include
            the following in order: <br />- Date<br />- From Display Name<br />- From
            Email<br />- Subject<br />- Recipient Email<br />- Job Title of Sender<br
            />- Job Title of Recipient<br />- Abnormals best guess of attack type<br
            />- Abnormals best guess of attack strategy<br />- Abnormals best guess
            of impersonated entity<br />- Abnormals best guess of attack vector<br
            />- Remediation Status<br />- Remediation Time<br />- Judgement<br />-
            Abnormal Message ID<br />- Threat ID<br />- Tenant ID<br />- Tenant Name'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
  /url-rewrite/clicked-events:
    get:
      operationId: v1_url_rewrite_clicked_events_retrieve
      description: Retrieve paginated click and clickthrough events for URL rewrites.
        Supports filtering by Unix time range, user email, and event type. Returns
        events where users clicked on rewritten URLs in email messages.
      summary: Get URL rewrite click and clickthrough events
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: 'Number of results to return per page (default: 20, max: 100)'
      - in: query
        name: start
        schema:
          type: integer
        description: Start time of the time range to filter by (Unix timestamp)
      - in: query
        name: end
        schema:
          type: integer
        description: End time of the time range to filter by (Unix timestamp)
      - in: query
        name: recipient
        schema:
          type: string
        description: Email address recipient of the email message to filter by
      - in: query
        name: event_type
        schema:
          type: string
        description: Event type to filter by (Click/Clickthrough)
      - in: query
        name: offset
        schema:
          type: string
        description: Offset to use for pagination
      tags:
      - URL Rewrite
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClickedEventsResponse'
          description: A paginated list of clicked events
        '400':
          $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
        '500':
          $ref: '#/components/schemas/Error'
  /users:
