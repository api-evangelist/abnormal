components:
  responses:
    ActionDoesNotExistError:
      description: Action does not exist
    CaseDoesNotExistError:
      description: Abnormal Case does not exist
    ForbiddenError:
      description: Access to the resource is forbidden (e.g. IP not in allowlist)
    InvalidDateError:
      description: A date provided is in the wrong format or the date range is wider
        than the allowed range for this endpoint
    NotFoundError:
      description: Invalid user input when using the filter query parameter. Will
        return various error messages
    ThreatDoesNotExistError:
      description: Threat does not exist
    TooManyRequestsError:
      description: Request count exceeds allowed number of concurrent requests for
        this resource type
    UnauthorizedError:
      description: Access token is missing or invalid
  schemas:
    AbnormalCase:
      type: object
      properties:
        caseId:
          type: string
          description: A unique identifier for this case.
          example: 1234
        description:
          type: string
        severity_level:
          $ref: '#/components/schemas/SeverityLevel3eaEnum'
          description: Description of the severity level for this case.
        confidence:
          $ref: '#/components/schemas/ConfidenceEnum'
          description: The confidence level for this case.
        last_modified:
          type: string
          format: date-time
        first_observed:
          type: string
          format: date-time
        created:
          type: string
          format: date-time
        tenant:
          type: string
          nullable: true
          description: The short name of the tenant associated with this case. Not
            returned for Azure Sentinel integrations.
          example: my-tenant
      required:
      - caseId
      - confidence
      - created
      - description
      - first_observed
      - last_modified
      - severity_level
    AbnormalCaseDetails:
      type: object
      properties:
        caseId:
          type: string
          description: A unique identifier for this case.
          example: 1234
        case_status:
          $ref: '#/components/schemas/CaseStatusEnum'
        severity:
          type: string
          description: Description of the severity level for this case.
          example: Potential Account Takeover
        affectedEmployee:
          type: string
          description: Which employee this case pertains to.
          example: FirstName LastName
        customerVisibleTime:
          type: string
          format: date-time
        firstObserved:
          type: string
          format: date-time
          description: First time suspicious behavior was observed.
          example: '2020-06-09T17:42:59Z'
        threatIds:
          type: array
          items:
            type: string
          description: Threats related to Case
          example:
          - 184712ab-6d8b-47b3-89d3-a314efef79e2
        analysis:
          type: string
        remediation_status:
          $ref: '#/components/schemas/RemediationStatusEnum'
        severity_level:
          $ref: '#/components/schemas/AbnormalCaseDetailsSeverityLevelEnum'
        confidence:
          $ref: '#/components/schemas/ConfidenceEnum'
          description: The confidence level for this case.
        genai_summary:
          type: array
          items:
            type: string
          description: List of AI-generated summary points for the case
        tenant:
          type: string
          nullable: true
          description: The short name of the tenant associated with this case. Not
            returned for Azure Sentinel integrations.
          example: my-tenant
      required:
      - affectedEmployee
      - analysis
      - caseId
      - case_status
      - confidence
      - customerVisibleTime
      - firstObserved
      - genai_summary
      - remediation_status
      - severity
      - severity_level
      - threatIds
    AbnormalCaseDetailsSeverityLevelEnum:
      enum:
      - NONE
      - LOW
      - MEDIUM
      - HIGH
      type: string
    AbuseCampaign:
      type: object
      properties:
        campaignId:
          type: string
          description: An id which maps to an abuse campaign.
          example: fff51768-c446-34e1-97a8-9802c29c3ebd
      required:
      - campaignId
    AbuseCampaignDetails:
      type: object
      properties:
        campaignId:
          type: string
          description: An id which maps to an abuse campaign.
          example: fff51768-c446-34e1-97a8-9802c29c3ebd
        firstReported:
          type: string
          format: date-time
          description: Date abuse campaign was first reported.
          example: '2020-11-11T13:11:40-08:00'
        lastReported:
          type: string
          format: date-time
          description: Date abuse campaign was last reported.
          example: '2020-11-11T13:11:40-08:00'
        messageId:
          type: string
          description: A unique identifier for the first message in the abuse campaign.
          example: -1234567891011121314
        subject:
          type: string
          description: Subject of the first email in the abuse campaign.
          example: 'Fwd: This is spam'
        fromName:
          type: string
          description: The display name of the sender.
          example: Support
        fromAddress:
          type: string
          description: The email address of the sender.
          example: support@secure-reply.org
        recipientName:
          type: string
          description: The display name of the recipient.
          example: Tom
        recipientAddress:
          type: string
          description: The email address of the recipient.
          example: example@example.com
        judgementStatus:
          type: string
          description: Judgement status of message.
          example: Malicious
        overallStatus:
          type: string
          description: Overall status of message.
          example: Could not find original message
        attackType:
          type: string
          description: The type of threat the message represents. This is only present
            for abuse campaigns judged Malicious or Spam
          example: 'Malicious: Phishing'
      required:
      - attackType
      - campaignId
      - firstReported
      - fromAddress
      - fromName
      - judgementStatus
      - lastReported
      - messageId
      - overallStatus
      - recipientAddress
      - recipientName
      - subject
    AbuseMailboxUnanalyzedMessage:
      type: object
      properties:
        subject:
          type: string
          description: Subject of the message
          example: Read me
        abx_message_id:
          type: integer
        reported_datetime:
          type: string
          format: date-time
        recipient:
          $ref: '#/components/schemas/User'
        reporter:
          $ref: '#/components/schemas/User'
        not_analyzed_reason:
          $ref: '#/components/schemas/NotAnalyzedReasonEnum'
      required:
      - abx_message_id
      - not_analyzed_reason
      - recipient
      - reported_datetime
      - reporter
      - subject
    AbuseMailboxUnanalyzedResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/AbuseMailboxUnanalyzedMessage'
          description: A list of representations of messages that were reported to
            AI Security Mailbox (formerly known as Abuse Mailbox) but not analyzed.
      required:
      - results
    ActionEnum:
      enum:
      - search
      - remediation
      - csv_export
      title: ActionEnum
      type: string
    ActionReasonEnum:
      enum:
      - false_negative
      - unsolicited
      - other
      - groups_remediation
      - quarantine_release
      title: ActionReasonEnum
      type: string
    ActionStatus:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ActionStatusStatusEnum'
        description:
          type: string
          description: Description of the action
          example: The request was completed successfully
        tenantId:
          type: integer
          nullable: true
          description: The tenant ID associated with the threat
          example: 1234
        tenantName:
          type: string
          nullable: true
          description: The short name of the tenant associated with the threat
          example: example-tenant
      required:
      - description
      - status
      - tenantId
      - tenantName
    ActionStatusEnum:
      enum:
      - pending
      - success
      - partial_success
      - error
      title: ActionStatusEnum
      type: string
    ActionStatusStatusEnum:
      enum:
      - acknowledged
      - in_progress
      - done
      - error
      type: string
    ActivitiesResponse:
      properties:
        activities:
          items:
            $ref: '#/components/schemas/ActivityLogEntry'
          title: Activities
          type: array
        total:
          title: Total
          type: integer
        pageNumber:
          title: Pagenumber
          type: integer
        pageSize:
          title: Pagesize
          type: integer
        metadata:
          $ref: '#/components/schemas/MetaData'
      required:
      - activities
      - total
      - pageNumber
      - pageSize
      - metadata
      title: ActivitiesResponse
      type: object
    ActivityLogEntry:
      properties:
        activity_id:
          title: Activity Id
          type: integer
        action:
          $ref: '#/components/schemas/ActionEnum'
        status:
          $ref: '#/components/schemas/ActionStatusEnum'
        performed_by:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Performed By
        timestamp:
          format: date-time
          title: Timestamp
          type: string
        result_count:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Result Count
        parameters:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Parameters
        submit_d360_case:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Submit D360 Case
      required:
      - activity_id
      - action
      - status
      - timestamp
      title: ActivityLogEntry
      type: object
    ActivityStatusResponse:
      properties:
        activity_id:
          title: Activity Id
          type: integer
        action:
          anyOf:
          - $ref: '#/components/schemas/ActionEnum'
          - type: 'null'
          default: null
        status:
          anyOf:
          - $ref: '#/components/schemas/ActionStatusEnum'
          - type: 'null'
          default: null
        performed_by:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Performed By
        timestamp:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          default: null
          title: Timestamp
        result_count:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Result Count
        remediation_details:
          anyOf:
          - items:
              $ref: '#/components/schemas/RemediationDetail'
            type: array
          - type: 'null'
          default: null
          title: Remediation Details
        total:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Total
        metadata:
          $ref: '#/components/schemas/MetaData'
      required:
      - activity_id
      - metadata
      title: ActivityStatusResponse
      type: object
    Actor:
      type: object
      properties:
        display_name:
          type: string
          description: Display name of the actor who performed the action
          example: ABNORMAL_SECURITY
    Attachment:
      properties:
        name:
          title: Name
          type: string
        md5_hash:
          title: Md5 Hash
          type: string
      required:
      - name
      - md5_hash
      title: Attachment
      type: object
    AttackFrequency:
      type: object
      properties:
        timeStamp:
          type: string
          format: date-time
          description: The date and time the attack was received.
          example: '2023-08-11T12:34:56Z'
        attackType:
