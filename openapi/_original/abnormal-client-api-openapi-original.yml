  /threats:
    get:
      operationId: v1_threats_retrieve
      summary: Get a list of threats
      parameters:
      - in: query
        name: filter
        schema:
          type: string
        description: Value must be of the format `filter={FILTER KEY} gte YYYY-MM-DDTHH:MM:SSZ
          lte YYYY-MM-DDTHH:MM:SSZ`. A `{FILTER KEY}` must be specified, and currently
          the keys that are supported for `/threats` are `receivedTime` and `latestTimeRemediated`.
          At least 1 of `gte`/`lte` must be specified, with a datetime string following
          the `YYYY-MM-DDTHH:MM:SSZ format`.
        style: spaceDelimited
        examples:
          ReceivedTime:
            value: receivedTime gte 2020-01-01T01:01:01Z lte 2021-12-01T01:01:01Z
            summary: receivedTime
          LatestTimeRemediated:
            value: latestTimeRemediated gte 2020-01-01T01:01:01Z lte 2021-12-01T01:01:01Z
            summary: latestTimeRemediated
      - in: query
        name: pageSize
        schema:
          type: integer
          minimum: 1
          default: 100
        description: ' Number of threats on each page. Each page of data will have
          at most pageSize threats. Has no effect if filter is not specified.'
      - in: query
        name: pageNumber
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-indexed page number to get a particular page of threats. Has
          no effect if filter is not specified.
      - in: header
        name: mock-data
        schema:
          type: string
          default: 'False'
          enum:
          - 'False'
          - 'True'
        description: Returns test data if set to `True`
      - in: query
        name: source
        schema:
          type: string
          default: all
          enum:
          - all
          - attacks
          - borderline
          - spam
        description: Filters threats based on the source of detection. 'all' returns
          threats from all sources, 'spam' returns only spam threats, 'attacks' returns
          only attack threats, and 'borderline' returns only borderline threats.
      - in: query
        name: sender
        schema:
          type: string
        description: Filters threats based on the name or email address of the sender
      - in: query
        name: recipient
        schema:
          type: string
        description: Filters threats based on the name or email address of the recipient
      - in: query
        name: subject
        schema:
          type: string
        description: Filters threats based on the email subject
      - in: query
        name: topic
        schema:
          type: string
          enum:
          - Billing Account Update
          - Covid-19 Related Attack
          - Cryptocurrency
          - Invoice
          - Invoice Inquiry
        description: Filters threats based on the topic of email contents
      - in: query
        name: attackType
        schema:
          type: string
          enum:
          - Internal-to-Internal Attacks (Email Account Takeover)
          - Spam
          - Reconnaissance
          - Scam
          - Social Engineering (BEC)
          - 'Phishing: Credential'
          - Invoice/Payment Fraud (BEC)
          - Malware
          - Extortion
          - 'Phishing: Sensitive Data'
          - Other
        description: Filters threats based on the type of attack
      - in: query
        name: attackVector
        schema:
          type: string
          enum:
          - Link
          - Attachment
          - Text
          - Others
          - Attachment with Zipped File
          - QR Code
          - Calendar Invite
          - Spam Bomb
        description: Filters threats based on the attack vector
      - in: query
        name: attackStrategy
        schema:
          type: string
          enum:
          - Name Impersonation
          - Internal Compromised Email Account
          - External Compromised Email Account
          - Spoofed Email
          - Unknown Sender
          - Covid 19 Related Attack
        description: Filters threats based on the attack strategy
      - in: query
        name: impersonatedParty
        schema:
          type: string
          enum:
          - VIP
          - Assistants
          - Employee (other)
          - Brand
          - Known Partners
          - Automated System (Internal)
          - Automated System (External)
          - Unknown Partner
          - None / Others
        description: Filters threats based on the impersonated party
      tags:
      - Threats
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedThreats'
          description: A list of the IDs of the top 100 threats identified in Threat
            Log if no filter query parameter is specified, or a paginated list of
            threats if a filter query parameter is specified. The pageNumber and nextPageNumber
            fields will be absent if no filter query parameter is used. The nextPageNumber
            field will be absent if there are no more pages of data.
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
