note: Abnormal AI publishes NO Model Context Protocol server. Searched the Abnormal docs and blog, npm
  (@modelcontextprotocol and 'abnormal*' — nothing first-party), the GitHub orgs abnormal-security and
  abnormal-ai, and probed mcp.abnormal.ai, mcp.abnormalsecurity.com and https://api.abnormalplatform.com/mcp
  (DNS NXDOMAIN, NXDOMAIN, 401 respectively). Abnormal's own engineering blog (abnormal.ai/blog/abnormal-accelerates-developer-velocity-with-mcp,
  fetched 2026-08-02) states their MCP server 'operates locally on developer machines' behind an internal
  proxy — it is an internal developer-productivity tool, not a customer-facing surface. The only MCP metadata
  reachable on an Abnormal hostname is SafeBase's, served at security.abnormal.ai/.well-known/openid-configuration
  for the trust center (issuer https://app.safebase.io/api/mcp) — a vendor surface, not an Abnormal API
  surface. The tools below are therefore a CANDIDATE agent surface derived one-per-operation from the
  live Abnormal Security Client API OpenAPI 3.0.3; each tool inherits its real input schema from that
  operation's parameters and requestBody. Nothing here is published by Abnormal, and no MCPServer pointer
  is wired in apis.yml.
