apis:
- aid: abnormal:client-api
  name: Abnormal Security Client API
  description: 'REST API for managing the security threats, cases and posture that Abnormal AI
    detects for an organization. Covers threats and threat actions, Abnormal cases and case
    analysis, message detail and attachment download, the AI Security Mailbox (formerly Abuse
    Mailbox), employee identity and login insights, VendorBase vendors and vendor cases,
    Detection 360 reports, search and remediation, audit logs, RBAC roles and users, SOAR
    tokens, security settings, URL-rewrite click events, Security Posture Management (SPM v2)
    and the dashboard aggregation metrics. Bearer-token authenticated, with IP allowlisting
    and a Mock-Data test mode.'
