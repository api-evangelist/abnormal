aid: abnormal
name: Abnormal AI
description: 'Abnormal AI (formerly Abnormal Security) is a San Francisco based cloud email
  and human-behavior security company whose behavioral AI platform protects Microsoft 365 and
  Google Workspace against phishing, business email compromise, vendor fraud, account takeover
  and misdirected email. The platform is API-first: it integrates with Microsoft and Google
  over their APIs rather than by rewriting MX records, and every capability in the Abnormal
  Portal — threats, cases, AI Security Mailbox, employee and vendor insights, audit logs,
  RBAC roles and users, security posture management and dashboard aggregations — is also
  reachable through the Abnormal Security Client API, a bearer-token REST API published as
  OpenAPI 3.0.3 on SwaggerHub with separate US and EU production hosts. Abnormal also streams
  the same event data to SIEM and SOAR platforms over near-real-time webhooks.'
image: https://www.abnormal.ai/og/home.png
